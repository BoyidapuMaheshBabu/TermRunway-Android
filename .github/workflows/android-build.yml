name: Android build

on:
  push:
    branches:
      - main
      - termrunway
      - feature/offline-v1-completion
      - feature/top-navigation-ui
      - feature/brand-theme-logo
      - 'phase/**'
  pull_request:
    branches:
      - main
      - termrunway
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Run unit tests
        id: tests
        continue-on-error: true
        run: ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: termrunway-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Fail workflow if tests failed
        if: steps.tests.outcome == 'failure'
        run: |
          echo "Unit tests failed. The APK was still built and uploaded for inspection."
          exit 1
